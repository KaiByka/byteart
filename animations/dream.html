<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>DREAM PROTOCOL</title>
    <style>
        body {
            margin: 0;
            overflow: hidden;
            background: #000;
            color: #0f0;
            font-family: monospace;
        }

        canvas {
            display: block;
        }
    </style>
    <link rel="icon" type="image/png" href="../favicon.png">
    <style>
        #back-btn {
            position: fixed;
            top: 20px;
            right: 20px;
            z-index: 9999;
            font-family: 'Courier New', monospace;
            font-size: 12px;
            color: #fff;
            background: #000;
            border: 1px solid #333;
            padding: 8px 12px;
            text-decoration: none;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        #back-btn:hover {
            border-color: #fff;
        }
    </style>
</head>

<body>
    <a id="back-btn" href="../index.html">&laquo; ARCHIVE</a>
    <script>if (window.self !== window.top) document.getElementById('back-btn').style.display = 'none';</script>
    <canvas id="c"></canvas>
    <script>
        const canvas = document.getElementById('c');
        const ctx = canvas.getContext('2d');

        let width, height;
        let columns = [];
        const fontSize = 14;
        let drops = [];

        function init() {
            width = canvas.width = window.innerWidth;
            height = canvas.height = window.innerHeight;

            const numColumns = Math.ceil(width / fontSize);
            drops = new Array(numColumns).fill(1).map(() => Math.random() * -100);
        }

        const hex = "0123456789ABCDEF";

        function animate() {
            ctx.fillStyle = 'rgba(0, 0, 0, 0.05)';
            ctx.fillRect(0, 0, width, height);

            ctx.fillStyle = '#0F0';
            ctx.font = fontSize + 'px monospace';

            for (let i = 0; i < drops.length; i++) {
                const text = hex.charAt(Math.floor(Math.random() * hex.length));
                ctx.fillText(text, i * fontSize, drops[i] * fontSize);

                if (drops[i] * fontSize > height && Math.random() > 0.975) {
                    drops[i] = 0;
                }
                drops[i]++;
            }
            requestAnimationFrame(animate);
        }

        window.addEventListener('resize', init);
        init();
        animate();
    </script>
</body>

</html>
