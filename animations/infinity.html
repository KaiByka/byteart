<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Infinity: Endless Zoom Feedback Loop</title>
    <style>
        @font-face {
            font-family: 'JetBrains Nerd Mono';
            font-style: normal;
            font-weight: 400;
            font-display: swap;
            src: url(../assets/fonts/jetbrains-nerd-mono-Regular.woff2) format('woff2');
        }

        @font-face {
            font-family: 'JetBrains Nerd Mono';
            font-style: normal;
            font-weight: 700;
            font-display: swap;
            src: url(../assets/fonts/jetbrains-nerd-mono-Bold.woff2) format('woff2');
        }

        body {
            margin: 0;
            overflow: hidden;
            background: #050505;
            font-family: 'JetBrains Nerd Mono', monospace;
        }

        canvas {
            display: block;
        }

        #ui {
            position: absolute;
            top: 20px;
            left: 20px;
            color: #fff;
            pointer-events: none;
            mix-blend-mode: exclusion;
        }

        h1 {
            margin: 0;
            font-size: 16px;
            letter-spacing: 2px;
            text-transform: uppercase;
        }

        .sub {
            font-size: 10px;
            opacity: 0.7;
            margin-top: 4px;
        }

        #depth {
            font-size: 10px;
            opacity: 0.7;
            margin-top: 2px;
        }

        #back-btn {
            position: fixed;
            top: 20px;
            right: 20px;
            z-index: 9999;
            font-family: 'JetBrains Nerd Mono', monospace;
            font-size: 12px;
            color: #fff;
            background: #000;
            border: 1px solid #333;
            padding: 8px 12px;
            text-decoration: none;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        #back-btn:hover {
            border-color: #fff;
        }
    </style>
    <link rel="icon" type="image/png" href="../favicon.png">
</head>

<body>
    <a id="back-btn" href="../index.html">&laquo; ARCHIVE</a>
    <div id="ui">
        <h1>Infinity</h1>
        <div class="sub">&#8734; // Self-similar feedback loop</div>
        <div id="depth">LOOP 0</div>
    </div>
    <canvas id="c"></canvas>
    <script>
        // The Droste effect on a canvas: each frame, the previous
        // frame is drawn back into itself, slightly scaled down and
        // rotated. The image contains itself, forever. The feedback
        // never reaches a "bottom" - zooming in only reveals more
        // of the same structure. Mathematically this is an iterated
        // affine map with a fixed point: a fractal in the time
        // dimension, self-similar at every scale.

        const canvas = document.getElementById('c');
        const ctx = canvas.getContext('2d');

        let width, height;
        let time = 0;

        // Zoom state
        const GROWTH = 1.02;     // the past expands by this factor every frame
        const SPIN = 0.02;       // radians added every frame (the spiral twist)
        const CYCLE = 314;       // frames per full twist (2*PI/SPIN)

        // Interaction
        let autoRotate = true;
        let rotationOffset = 0;
        let SPIN_DIR = 1;        // +1 / -1: twist handedness

        // Shape drift: unused hue state removed; rotation and the
        // seed glyph carry all the motion.

        function init() {
            width = canvas.width = window.innerWidth;
            height = canvas.height = window.innerHeight;
            buf.width = width;
            buf.height = height;
            // Seed the first frame so the loop has something to eat
            ctx.fillStyle = '#050505';
            ctx.fillRect(0, 0, width, height);
            drawGlyph(width / 2, height / 2, 0);
        }

        // The "seed" geometry: a single white arc-frame that the
        // feedback loop will recurse into itself infinitely.
        function drawGlyph(cx, cy, rot) {
            const r = Math.min(width, height) * 0.16;
            ctx.save();
            ctx.translate(cx, cy);
            ctx.rotate(rot);

            // A square frame with one red corner node - the loop
            // marker. When you see the red node, you have travelled
            // exactly one period of the recursion.
            ctx.lineWidth = 2;
            ctx.strokeStyle = 'rgba(255, 255, 255, 0.9)';
            ctx.strokeRect(-r, -r, r * 2, r * 2);

            // Inner circle
            ctx.beginPath();
            ctx.arc(0, 0, r * 0.7, 0, Math.PI * 2);
            ctx.stroke();

            // Diagonals
            ctx.beginPath();
            ctx.moveTo(-r, -r);
            ctx.lineTo(r, r);
            ctx.moveTo(r, -r);
            ctx.lineTo(-r, r);
            ctx.stroke();

            // Red node marker (accent color of the archive)
            ctx.fillStyle = '#ff0000';
            ctx.beginPath();
            ctx.arc(-r, -r, 5, 0, Math.PI * 2);
            ctx.fill();

            ctx.restore();
        }

        // Feedback needs an offscreen buffer: putImageData ignores
        // transforms and alpha, but drawImage respects both.
        const buf = document.createElement('canvas');
        const bctx = buf.getContext('2d');

        function loop() {
            time++;
            const depthEl = document.getElementById('depth');

            // 1. Copy current frame to buffer
            bctx.clearRect(0, 0, width, height);
            bctx.drawImage(canvas, 0, 0);

            // 2. Erase main
            ctx.fillStyle = '#050505';
            ctx.fillRect(0, 0, width, height);

            // 3. THE INFINITE ZOOM: draw the previous frame back
            //    onto the canvas, but larger and rotated around the
            //    center. Whatever was on screen drifts outward and
            //    grows, revealing ever more detail inside. A single
            //    transformed copy is enough: it already contains
            //    every earlier copy (the feedback is recursive), so
            //    one pass per frame rebuilds the whole spiral.
            const spin = (autoRotate ? SPIN : 0) * SPIN_DIR;
            ctx.save();
            ctx.translate(width / 2, height / 2);
            ctx.rotate(spin + rotationOffset);
            ctx.scale(GROWTH, GROWTH);
            ctx.translate(-width / 2, -height / 2);
            ctx.drawImage(buf, 0, 0);
            ctx.restore();

            // 4. Inject fresh geometry at the center, so the deepest
            //    visible level is always the seed glyph. The loop
            //    consumes it next frame - it becomes the next ring.
            drawGlyph(width / 2, height / 2, time * spin);

            // UI: after CYCLE frames the twist completes one full
            // turn - a full "lap" of infinity. There is no last lap.
            depthEl.textContent = 'LOOP ' + Math.floor(time / CYCLE);

            reqId = requestAnimationFrame(loop);
        }

        // Optimization: pause when hidden
        let reqId;
        document.addEventListener("visibilitychange", () => {
            if (document.hidden) {
                if (reqId) cancelAnimationFrame(reqId);
            } else {
                reqId = requestAnimationFrame(loop);
            }
        });

        window.addEventListener('resize', init);

        // Interaction: drag to rotate the spiral by hand, double
        // click to flip zoom-twist direction. Scrolling would be
        // the natural gesture but the page must not scroll.
        let dragging = false;
        let lastX = 0;
        window.addEventListener('mousedown', e => {
            dragging = true;
            lastX = e.clientX;
        });
        window.addEventListener('mousemove', e => {
            if (!dragging) return;
            rotationOffset += (e.clientX - lastX) * 0.01;
            lastX = e.clientX;
        });
        window.addEventListener('mouseup', () => dragging = false);
        window.addEventListener('dblclick', () => {
            autoRotate = !autoRotate;
            SPIN_DIR = -SPIN_DIR;
        });

        init();
        reqId = requestAnimationFrame(loop);
    </script>
</body>

</html>
